<title>gcdatlas · the real universe, drawn in ASCII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Major+Mono+Display&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#04050a;
  --ink:#e2e8f5;
  --soft:#c3cbe0;
  --dim:#8491ae;
  --faint:#4b556e;
  --line:rgba(140,160,210,.22);
  --panel:rgba(5,7,14,.66);
  --flare:#ffb35c;
  --flare-bg:rgba(255,179,92,.13);
  --ship:#8fe6ff;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:"Major Mono Display","IBM Plex Mono",ui-monospace,monospace;
  --ts:1;   /* text size, set from settings */
  --cyan:#7fdcff;
  --mute:#ff968c;   /* soft red: the music is off */
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden}
body{font:calc(12.5px*var(--ts))/1.5 var(--mono);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* the page itself never zooms: a pinch that starts on the card or a panel must not blow up the whole page (their own scrolling still works) */
html,body{touch-action:pan-x pan-y}
button,input{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--void);outline:none}
#view.dragging{cursor:grabbing}
.info h1,.info .type,.info .where,.info .fact,.info .readout,.info .progress,.caption span,.help-card,.atlas-list .an,.trow small,.tm-sub{pointer-events:auto;-webkit-user-select:text;user-select:text;cursor:text}
#view,.labels,.ladder,.btn,.nav,.act,.seg,.tog,.shipmark,.shiparrow,.brand,.stop{-webkit-user-select:none;user-select:none}
body:has(#view.dragging) *{-webkit-user-select:none;user-select:none}
::selection{background:rgba(255,179,92,.35);color:#fff}

/* ---- info panel, top left */
.info{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(28px + 28.5px*var(--ts) + env(safe-area-inset-top,0px));
  max-width:min(440px,calc(100vw - 32px));pointer-events:none;text-shadow:0 0 14px #000,0 0 4px #000;z-index:2}
.info::before{content:"";position:absolute;inset:-100px -120px -50px -80px;z-index:-1;pointer-events:none;transition:opacity .25s;
  background:radial-gradient(closest-side,rgba(3,4,9,.9),rgba(3,4,9,.7) 55%,rgba(3,4,9,0))}
.brand{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:2;cursor:pointer;   /* (the logo goes home) */
  font-family:var(--disp);font-size:calc(19px*var(--ts));line-height:1.5;letter-spacing:.08em;color:var(--ink);text-shadow:0 0 12px rgba(143,200,255,.35),0 0 14px #000}
.tbadge{font-family:var(--mono);font-size:calc(10.5px*var(--ts));letter-spacing:.06em;color:var(--void);background:var(--flare);border-radius:2px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.stop{margin-top:0;color:var(--flare);display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:calc(11px*var(--ts));letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
/* the first thing on the row: "stop 3 / 31" on a tour, otherwise the kind of object (only while the type line is folded away: it says the same).
   The left part takes the room more / hide leave; only the kind is cut short. With very big text more / hide go to a second row. */
.stopl{flex:1 1 0;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;column-gap:8px;align-items:center;justify-content:start}
body.info-compact .stopl:has(> .stopinfo.kind:not(:empty)){grid-template-columns:minmax(0,max-content)}   /* (the kind's column can shrink to nothing, the chip's cannot) */
.stopinfo{white-space:nowrap;min-width:0}
.stopinfo.kind{overflow:hidden;text-overflow:ellipsis}
.stopinfo:empty,body:not(.info-compact) .stopinfo.kind{display:none}
/* the Halo tour (0.9.9): one small line in the Halo's blue over the place's name, what the ship is doing there or where it is going */
.htline{margin-top:4px;color:var(--ship);font-size:calc(10.5px*var(--ts));letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htline:not([hidden]) + .title{margin-top:1px}
.title{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:4px 0 0}
.info h1{font-family:var(--mono);font-weight:500;font-size:calc(clamp(22px,3vw,30px)*var(--ts));line-height:1.15;margin:0;letter-spacing:0;text-wrap:balance;font-variant-ligatures:none}
/* the green button beside the name says where it goes: "next stop · Moon ›", "start again ›", or (filled) "back to the tour · Earth ›" */
.gonext{pointer-events:auto;flex:0 1 auto;min-width:0;max-width:100%;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 9px 2px 11px;
  font-size:calc(11px*var(--ts));letter-spacing:.03em;line-height:1.4;color:#a8f0b0;background:rgba(168,240,176,.1);border:1px solid rgba(168,240,176,.55);border-radius:13px;cursor:pointer;white-space:nowrap;text-shadow:none}
.gonext span{overflow:hidden;text-overflow:ellipsis}
.gonext b{flex:none;font-weight:600;font-size:1.35em;line-height:1;margin-top:-2px}
.gonext:hover{color:#d6ffdb;background:rgba(168,240,176,.18);border-color:#a8f0b0}
.gonext.back{color:var(--void);background:#a8f0b0;border-color:#a8f0b0;font-weight:600}
.gonext.back:hover{color:var(--void);background:#c8ffd0}
.nav{pointer-events:auto;flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--dim);background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;font-size:calc(15px*var(--ts));line-height:1;padding:0}
.nav:hover{color:var(--flare);border-color:var(--line)}
.type{color:var(--dim);font-size:calc(11.5px*var(--ts));letter-spacing:.03em}
.where{color:var(--soft);font-size:calc(11.5px*var(--ts));font-variant-numeric:tabular-nums}
.fact{margin:9px 0 0;max-width:46ch;color:var(--soft);font-size:calc(12.5px*var(--ts))}
.readout.fade{animation:fadeIn 1s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.info{animation:fadeIn 1.2s ease-out}
.readout{margin-top:8px;color:var(--flare);font-size:calc(11.5px*var(--ts));font-variant-numeric:tabular-nums;white-space:pre-wrap;min-height:1.5em;max-width:50ch}
.scale{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--soft);font-size:calc(11px*var(--ts));font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:auto;cursor:help;width:max-content}
.scale .rlab{color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-size:calc(10px*var(--ts))}
.scale .bar{display:inline-block;height:5px;border:1px solid var(--soft);border-top:0;flex:none}
/* the angle line sits right under the name (owner, 0.9.9: at the bottom of the panel it looked cut off from it), so the two read as one header */
.progress{margin-top:1px;color:var(--faint);font-size:calc(11px*var(--ts));white-space:pre;font-variant-numeric:tabular-nums;display:flex;align-items:center;min-height:1.5em}
/* the angle arrows sit on the angle line, around the grey ASCII bar, and only while it shows */
.progress .anav{display:none;width:26px;height:24px;margin:-4px 0;font-size:calc(15px*var(--ts));color:var(--soft);cursor:pointer}
.progress .plab{flex:0 1 auto;min-width:0;overflow:hidden}   /* (with very big text the bar is cut short rather than pushing the arrow out of the card) */
.progress .anav:first-child{margin-left:-8px}
.progress.angles .anav{display:grid}

.mode{flex:none;display:inline-block;padding:1px 7px;border-radius:2px;border:1px solid rgba(255,179,92,.45);color:var(--flare)}
.mode.m-tour{border-color:rgba(160,240,170,.5);color:#a8f0b0}
/* on a tour its name is a button: "GRAND TOUR ▾" opens the list of tours */
.mode.tourpick{flex:none;display:inline-flex;align-items:center;gap:.5em;pointer-events:auto;font:inherit;letter-spacing:inherit;text-transform:inherit;line-height:inherit;background:none;cursor:pointer;white-space:nowrap}
.mode.tourpick span{overflow:hidden;text-overflow:ellipsis}
.mode.tourpick:hover,.mode.tourpick[aria-expanded="true"]{background:rgba(168,240,176,.12);border-color:#a8f0b0}
.mode.m-free{background:var(--cyan);border-color:var(--cyan);color:var(--void);font-weight:600;animation:modeFlash 1.2s ease-out 1}
@keyframes modeFlash{0%{box-shadow:0 0 0 0 rgba(127,220,255,.9)}100%{box-shadow:0 0 0 12px rgba(127,220,255,0)}}

/* info panel controls: more / less, hide, and the pill that brings it back */
.grip{display:none}
.itools{flex:none;margin-left:auto;display:inline-flex;gap:2px;pointer-events:auto}
.itool{white-space:nowrap;font:inherit;font-size:calc(10px*var(--ts));letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:none;border:1px solid transparent;border-radius:3px;padding:1px 6px;cursor:pointer;
  min-height:28px;margin:-4.5px 0}   /* (a 28 px target; the negative margin keeps the row's height) */
.itool:hover{color:var(--ink);border-color:var(--line)}
body.info-compact .info .acts,body.info-compact .info .qrow,body.info-compact .info .type,body.info-compact .info .fact,body.info-compact .info .readout,body.info-compact .info .scale{display:none}
body.info-hidden .info{display:none}
.info-pill{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(28px + 28.5px*var(--ts) + env(safe-area-inset-top,0px));z-index:2;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 120px);
  padding:3px 11px 3px 4px;color:var(--soft);background:var(--panel);border:1px solid var(--line);border-radius:14px;font-size:calc(11.5px*var(--ts));cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.info-pill b{flex:none;display:grid;place-items:center;width:calc(18px*var(--ts));height:calc(18px*var(--ts));border-radius:50%;border:1px solid var(--flare);color:var(--flare);font-size:calc(10.5px*var(--ts));font-weight:600;font-style:italic;font-family:Georgia,serif}
.info-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-pill:hover{color:var(--ink);border-color:rgba(255,179,92,.5)}
/* scale chip: the phone's way into the scale ladder */
.lad-chip{display:none}

/* idle: after a few quiet seconds the interface fades, leaving the object's name; any touch, key or mouse move brings it back */
.brand,.lad-chip,.play-m,.info-pill,.itools,.grip,.info .nav,.info .gonext,.info .stop,.info .title,.info .acts,.info .type,.info .where,.info .fact,.info .readout,.info .scale,.info .progress,.info .htline{transition:opacity .25s}
body.ui-idle .controls,body.ui-idle .ladder,body.ui-idle .lad-chip,body.ui-idle .play-m,body.ui-idle .brand,body.ui-idle .info-pill,body.ui-idle .daily,body.ui-idle .shiparrow,body.ui-idle .backpill,
body.ui-idle .itools,body.ui-idle .grip,body.ui-idle .info .nav,body.ui-idle .info .gonext,body.ui-idle .info .acts,body.ui-idle .info .type,body.ui-idle .info .where,body.ui-idle .info .fact,body.ui-idle .info .readout,body.ui-idle .info .scale{opacity:0!important;transition:opacity 1s ease-in}
/* a faded button still works on the first tap (it also brings the interface back); a tap on the sky only brings it back (src/09h-ui.js).
   The scale bar's faded track is sky too: on a touch screen a tap there would otherwise fly to the nearest marker (tablets keep the desk layout) */
@media (pointer:coarse){ body.ui-idle .lad-track,body.ui-idle .ladmark{pointer-events:none} }
body.ui-idle .info .stop,body.ui-idle .info .htline,body.ui-idle .info .title,body.ui-idle .info .progress{opacity:.5;transition:opacity 1s ease-in}
body.ui-idle .info .progress.hintish,body.ui-idle .info .progress.tip{opacity:0}
body.ui-idle .info::before{opacity:0;transition:opacity 1s}
body.ui-idle .caption{background:rgba(5,7,14,.4);border-color:transparent;border-left-color:var(--flare);transition:background 1s,border-color 1s,opacity .4s}
/* (and fades away a few seconds after it is written out, until the next caption: updateCaption in 09-render.js) */
body.ui-idle .caption.rest{opacity:0;transition:background 1s,border-color 1s,opacity 1.8s ease-in}

/* info actions: share, compare */
.acts{display:flex;gap:6px;margin:9px 0 2px}
.acts.qrow{flex-wrap:wrap;margin:7px 0 2px}
.acts.qrow[hidden]{display:none}
.act{pointer-events:auto;font-size:calc(10.5px*var(--ts));letter-spacing:.06em;color:var(--dim);background:rgba(5,7,14,.5);border:1px solid var(--line);border-radius:10px;padding:2px 9px;cursor:pointer}
.act:hover{color:var(--flare);border-color:rgba(255,179,92,.5)}
.act[aria-pressed="true"]{color:var(--flare);border-color:rgba(255,179,92,.6)}

/* story captions and compare banner, bottom centre */
.caption{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(640px,calc(100vw - 32px));box-sizing:border-box;
  display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(5,7,14,.72);border:1px solid var(--line);border-left:2px solid var(--flare);border-radius:3px;
  color:var(--ink);font-size:calc(13px*var(--ts));line-height:1.5;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:3;text-wrap:pretty}
.caption span{flex:1}
.caption span::after{content:"_";color:var(--flare);margin-left:2px;animation:blink 1s steps(1) infinite}
.caption.done span::after{content:""}
@keyframes blink{50%{opacity:0}}

/* ---- controls, top right. The bar leaves 400 px on its left for the logo and the info panel (440 before 0.9.9: the top row sits above the
   panel, and the Halo tour switch needed the room to keep the top row on one line at 1280 px) */
.controls{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));
  display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center;max-width:calc(100vw - 400px);z-index:6}
.btn{font-size:calc(11.5px*var(--ts));color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:6px 10px;cursor:pointer;letter-spacing:.03em;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:rgba(200,215,245,.45)}
.btn[aria-pressed="true"],.btn[aria-expanded="true"]{color:var(--flare);border-color:rgba(255,179,92,.6)}
#btnShip[aria-pressed="true"]{color:var(--ship);border-color:rgba(143,230,255,.55)}
/* the sound button: as wide as "sound off" either way, so the bar never re-wraps; soft red while no music plays (no animation, it fades with the bar) */
#btnSound{min-width:calc(9.5ch + 22px);text-align:center}
#btnSound.silent{color:var(--mute);border-color:rgba(255,128,118,.5)}
#btnSound.silent:hover{color:#ffb8b0;border-color:rgba(255,128,118,.75)}
.btn.primary{color:var(--ink)}
.seg.mini{flex-wrap:nowrap;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:1px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.seg.mini button{flex:0 0 auto;border:0;background:none;padding:4px 7px;font-size:calc(11px*var(--ts));border-radius:2px}
.seg.mini .seg-l{align-self:center;padding:0 4px 0 7px;color:var(--faint);font-size:calc(10px*var(--ts));letter-spacing:.08em}
/* two rows on a desk: the tools on top; travel, resume tour and play / pause below (right-aligned), so the play button's words
   ("pause", "back to the Moon") can change without anything on the top row moving or a button jumping between rows */
.controls::after{content:"";order:7;flex-basis:100%;height:0}
.controls .seg.mini,.controls .btn.play{margin-top:-6px}   /* (the break adds a second gap: the lower row keeps its old place) */
.controls .seg.mini{order:8}
.btn.play{order:10;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn.play span{display:inline-block;max-width:24ch;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}   /* ("back to the Large Magellanic Cloud" in free camera) */
#btnHome::before{content:attr(data-ico);margin-right:5px}
.btn.play b::before,.play-m b::before{content:"\275A\275A";font-size:.82em;letter-spacing:-.12em;font-weight:400}
.btn.play.paused b::before,.play-m.paused b::before{content:"\25B6\FE0E";letter-spacing:0}
.btn.play.paused{color:var(--cyan);border-color:rgba(127,220,255,.6);background:rgba(127,220,255,.1)}
.play-m{display:none}
.topr{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:calc(6px + env(safe-area-inset-top,0px));z-index:6;display:flex;align-items:center;gap:6px;pointer-events:none}
.topr > *{pointer-events:auto}
#btnRide{color:var(--ship)}
#btnRide.following{color:var(--void);background:var(--ship);border-color:var(--ship)}
/* the Halo's buttons (ship, ride) sit on the lower row beside play (0.9.9: the Halo tour switch made the top row too wide at 1280 px); riding
   along, the camera switch (moving / still) joins them, on their left so ride stays put */
.controls #rideCamSeg,.controls #btnShip,.controls #btnRide{order:9;margin-top:-6px}
#rideCamSeg[hidden],.ht-note[hidden]{display:none}
#rideCamSeg button[aria-checked="true"]{color:var(--ship)}
/* tours, and right of it the Halo tour switch (0.9.9, owner review: "a typical toggle"): the words "Halo tour" and a pill switch, like a phone
   setting. Off: a grey track, the knob on the left. On: the track glows Halo blue, the knob on the right. The whole control is one button
   (role switch: a click, Space or Enter flips it). .hsw-t is the track and its ::before the knob; the ship menu and the list of tours use them too */
.tours-pair{display:inline-flex;align-items:stretch;gap:4px;flex:none}
#btnTours::before{content:attr(data-ico);margin-right:5px}
.hsw{display:inline-flex;align-items:center;gap:7px;padding-top:0;padding-bottom:0;padding-right:6px;padding-left:9px;letter-spacing:0}
/* (34 x 18 px at the default text size, and it grows with the text; the knob is 12 px, 2 px in from the track's inside edge) */
.hsw-t{position:relative;flex:none;box-sizing:border-box;width:calc(34px*var(--ts));height:calc(18px*var(--ts));border-radius:999px;background:#343b4e;border:1px solid rgba(195,203,224,.3);
  transition:background .2s,border-color .2s,box-shadow .2s}
.hsw-t::before{content:"";position:absolute;top:50%;left:calc(2px*var(--ts));width:calc(12px*var(--ts));height:calc(12px*var(--ts));margin-top:calc(-6px*var(--ts));border-radius:50%;
  background:#c9d1e2;box-shadow:0 1px 2px rgba(0,0,0,.6);transition:transform .2s cubic-bezier(.3,.7,.4,1),background .2s}
[aria-checked="true"] > .hsw-t{background:var(--ship);border-color:var(--ship);box-shadow:0 0 9px rgba(143,230,255,.6),0 0 2px rgba(143,230,255,.9)}
[aria-checked="true"] > .hsw-t::before{transform:translateX(calc(18px*var(--ts) - 2px));background:var(--void);box-shadow:none}
.hsw[aria-checked="true"]{color:var(--ship);border-color:rgba(143,230,255,.55)}
/* (hover: the words and the border brighten (.btn:hover), the track too and the knob turns white; not on a touch screen, where it would stick after a tap) */
@media (hover:hover){
  :hover > .hsw-t{background:#444d65;border-color:rgba(195,203,224,.5)}
  :hover > .hsw-t::before{background:#fff}
  [aria-checked="true"]:hover > .hsw-t{background:#b4efff;border-color:#b4efff;box-shadow:0 0 13px rgba(143,230,255,.75),0 0 3px rgba(143,230,255,1)}
  [aria-checked="true"]:hover > .hsw-t::before{background:var(--void)}
  .hsw[aria-checked="true"]:hover{color:#c8f4ff;border-color:rgba(143,230,255,.8)}
}
@media (prefers-reduced-motion:reduce){ .hsw-t,.hsw-t::before{transition:none} }
#toursHaloSw{display:none}   /* (a phone's, at the top of the list of tours) */
body.showcase .hsw{display:none}   /* (the showcase scripts the ship's route itself) */
/* the list of tours says so while the Halo flies them */
#tours .ht-note{display:block;margin:0;padding:7px 12px;color:var(--ship);font-size:calc(11px*var(--ts));background:rgba(143,230,255,.07);border-bottom:1px solid rgba(143,230,255,.22)}
/* the flash when the Halo folds space with you aboard */
/* a launch shot that starts far from the last one dips through black (sxFade in s4-spacex-run.js) */
.sx-fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:1}
.fold-flash{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(235,250,255,.95) 0%,rgba(143,230,255,.55) 35%,rgba(20,40,70,.0) 80%)}
.fold-flash.go{animation:foldFlash 1.1s ease-out}
@keyframes foldFlash{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}
.fold-flash.ls{background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.9) 0%,rgba(200,225,255,.35) 30%,rgba(20,40,70,0) 70%)}
.fold-flash.go.ls{animation:foldFlash .5s ease-out}
/* the jump to light speed with you aboard: a short, soft blink (a white flash used to cover the screen) */
.fold-flash.blink{background:radial-gradient(ellipse at 50% 50%,rgba(215,240,255,.7) 0%,rgba(143,200,255,.22) 30%,rgba(20,40,70,0) 65%)}
.fold-flash.go.blink{animation:foldBlink .35s ease-out}
@keyframes foldBlink{0%{opacity:0}25%{opacity:.45}100%{opacity:0}}
/* the fold with the camera on the ship (0.9.3, owner): the whole screen flashes white for a split second as it jumps ('jump'), and a softer
   flash as its heart arrives at the far end ('arrive') */
.fold-flash.jump{background:radial-gradient(ellipse at 50% 50%,rgba(250,253,255,.98) 0%,rgba(205,240,255,.9) 45%,rgba(140,200,255,.75) 100%)}
.fold-flash.go.jump{animation:foldJump .6s ease-out}
@keyframes foldJump{0%{opacity:0}7%{opacity:.94}22%{opacity:.7}100%{opacity:0}}
.fold-flash.arrive{background:radial-gradient(ellipse at 50% 50%,rgba(240,250,255,.95) 0%,rgba(170,225,255,.7) 45%,rgba(90,150,230,.45) 100%)}
.fold-flash.go.arrive{animation:foldArrive .5s ease-out}
@keyframes foldArrive{0%{opacity:0}10%{opacity:.6}100%{opacity:0}}
@keyframes foldSoft{0%{opacity:0}20%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fold-flash.go{animation-duration:.4s}.fold-flash.go.jump,.fold-flash.go.arrive{animation-name:foldSoft}}
/* the Halo showcase's buttons (?showcase=halo), do it now: on a desk at the bottom, under the caption (its toasts go above the caption); on a
   phone at the top, below the bar (the same breakpoint as COMPACT_MQ). The key for each in a small grey figure (none on a phone) */
.demo-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;align-items:center;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;font:12px/1 'IBM Plex Mono',ui-monospace,monospace;color:#9bb3c4;background:rgba(4,5,10,.72);border:1px solid rgba(143,230,255,.25);border-radius:6px;padding:4px 4px 4px 8px}
.demo-bar b{font-weight:400;color:#6f8796;margin-right:4px}
.demo-bar button{font:inherit;color:inherit;background:none;border:1px solid rgba(143,230,255,.3);border-radius:4px;padding:7px 10px;min-height:30px;cursor:pointer}
.demo-bar button:hover{background:rgba(143,230,255,.12)}
.demo-bar button.on{color:#04050a;background:#8fe6ff}
.demo-bar button:focus-visible{outline:1px solid var(--flare);outline-offset:2px}
.demo-bar .k{color:#6f8796;margin-right:4px}
.demo-bar button.on .k{color:#04050a}
/* the lab (/lab, src/09l-lab.js; body.halo-lab, as .lab is already the labels' class): the stage and its panel, nothing else of the site's interface (the caption says what the ship is doing) */
body.halo-lab .brand,body.halo-lab .topr,body.halo-lab .info,body.halo-lab .info-pill,body.halo-lab .controls,body.halo-lab .atlas,body.halo-lab .panel,body.halo-lab .ladder,body.halo-lab .daily,body.halo-lab .saver-hud,body.halo-lab .photo-bar,body.halo-lab .help,body.halo-lab .shipmark,body.halo-lab .shiparrow,body.halo-lab .backpill{display:none !important}
.lab-panel{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:8;width:min(370px,calc(100vw - 24px));box-sizing:border-box;font:12px/1.3 'IBM Plex Mono',ui-monospace,monospace;color:#9bb3c4;background:rgba(4,5,10,.8);border:1px solid rgba(143,230,255,.25);border-radius:6px;padding:8px 10px}
.lab-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lab-h b{color:#d9ecf5;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.lab-h a{color:#8fe6ff;text-decoration:none}
.lab-row{display:flex;gap:6px;align-items:flex-start;margin:4px 0}
.lab-row>span{flex:0 0 52px;padding-top:7px;color:#6f8796;text-transform:uppercase;font-size:10px;letter-spacing:.08em}
.lab-row>div{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.lab-panel button{font:inherit;color:inherit;background:none;border:1px solid rgba(143,230,255,.3);border-radius:4px;padding:5px 8px;min-height:28px;cursor:pointer}
.lab-panel button:hover{background:rgba(143,230,255,.12)}
.lab-panel button.on{color:#04050a;background:#8fe6ff}
.lab-panel button:focus-visible{outline:1px solid var(--flare);outline-offset:2px}
.lab-load{align-items:center}
.lab-load input{flex:1;min-width:110px;accent-color:#8fe6ff}
.lab-load em{font-style:normal;color:#6f8796;flex-basis:100%}
.lab-note{margin:6px 0 0;color:#6f8796;font-size:10.5px}
@media (max-width:680px), (max-height:520px) and (max-width:1000px){ .lab-panel{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;width:calc(100vw - 16px);max-height:46vh;overflow:auto} .lab-note{display:none}
  body.halo-lab .caption{bottom:auto;top:calc(8px + env(safe-area-inset-top,0px))} }
@media (max-width:680px), (max-height:520px) and (max-width:1000px){ .demo-bar{left:calc(8px + env(safe-area-inset-left,0px));transform:none;justify-content:flex-start;bottom:auto;top:calc(52px + env(safe-area-inset-top,0px));max-width:calc(100vw - 16px)} .demo-bar button{min-height:40px;padding:8px 9px} .demo-bar .k{display:none} }
.btn:focus-visible,.gonext:focus-visible,.tourpick:focus-visible,.brand:focus-visible,.backpill:focus-visible,.lab:focus-visible,.arow:focus-visible,.tick:focus-visible,.nav:focus-visible,.seg button:focus-visible,.tog button:focus-visible,.song:focus-visible,.songs-btn:focus-visible,.ladmark:focus-visible{outline:1px solid var(--flare);outline-offset:2px}
.search{position:relative;display:flex;align-items:center}
.search input{width:190px;box-sizing:border-box;font-size:calc(12px*var(--ts));color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 30px 6px 10px;outline:none;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:rgba(255,179,92,.6);background:rgba(5,7,14,.85)}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{position:absolute;right:8px;font:calc(10px*var(--ts)) var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:2px;padding:0 4px;pointer-events:none}
.search input:focus + kbd{display:none}

.strip{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:3}
body.showcase .strip{padding-bottom:calc(124px + env(safe-area-inset-bottom,0px))}   /* (the Halo showcase: toasts above its caption and buttons) */
.toast{align-self:center;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-size:calc(11.5px*var(--ts));
  opacity:0;transition:opacity .4s;text-align:center;max-width:100%}
.toast.on{opacity:1}
.hint{color:var(--faint);font-size:calc(11px*var(--ts));text-align:center;transition:opacity .8s}

/* ---- labels on objects */
.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lab{position:absolute;left:0;top:0;font-size:calc(10.5px*var(--ts));color:var(--dim);letter-spacing:.06em;white-space:nowrap;background:none;border:0;
  padding:2px 4px;cursor:pointer;pointer-events:auto;text-shadow:0 0 6px #000,0 0 2px #000;will-change:transform,opacity;
  opacity:0;visibility:hidden;transition:opacity .3s ease-in,visibility 0s linear .3s}
.lab.on{opacity:1;visibility:visible;transition:opacity .8s ease-out,visibility 0s}
.lab:hover{color:var(--flare)}
/* places on Earth (0.13.0): teal like the atlas's "on Earth" kind; the five cities in 3D a little brighter */
.lab.emark{color:#3fd6c6;font-size:calc(10px*var(--ts))}
.lab.emark.e3d{color:#7ff0e2}
.lab.emark:hover{color:var(--flare)}
/* a plane's label in a city (0.17.0): small, faint, not clickable */
.lab.plane-lab{font-size:calc(9px*var(--ts));color:#9fb4c8;pointer-events:none;cursor:default}
.lab::before{content:"[ ";color:var(--faint)}
.lab::after{content:" ]";color:var(--faint)}
.lab.big{color:var(--soft);font-size:calc(11px*var(--ts));letter-spacing:.14em;text-transform:uppercase}
.lab.big::before,.lab.big::after{content:""}
.lab.star{color:var(--faint);font-size:calc(10px*var(--ts));cursor:default;pointer-events:none}
.lab.star::before,.lab.star::after{content:""}
.lab.ship{color:var(--ship)}
.lab.launch{color:var(--flare);font-size:calc(10px*var(--ts));pointer-events:none}
.lab.launch::before{content:"\25B2 ";color:var(--flare)}
.lab.launch::after{content:""}

/* ---- ship finder */
.shipmark{position:fixed;left:0;top:0;width:40px;height:40px;padding:0;background:none;border:0;cursor:pointer;z-index:2;will-change:transform;animation:shipPulse 2.4s ease-in-out infinite}
.shipmark i{position:absolute;width:8px;height:8px;border:1px solid var(--ship)}
.shipmark i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.shipmark i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.shipmark i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.shipmark i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.shipmark span{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;color:var(--ship);font-size:calc(10px*var(--ts));letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 6px #000}
.shiparrow{position:fixed;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 8px;color:var(--ship);background:rgba(5,10,16,.6);border:1px solid rgba(143,230,255,.35);border-radius:12px;
  font-size:calc(10px*var(--ts));letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;cursor:pointer;z-index:4;will-change:transform;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.shiparrow b{display:inline-block;font-weight:600;transition:transform .2s}
.shiparrow:hover,.shipmark:hover span{color:#fff}
/* free camera: the pill that points back to the object you let go of */
.backpill{position:fixed;left:0;top:0;display:flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;color:var(--flare);background:rgba(10,8,5,.72);border:1px solid rgba(255,179,92,.45);border-radius:14px;
  font-size:calc(11px*var(--ts));letter-spacing:.03em;white-space:nowrap;cursor:pointer;z-index:4;will-change:transform;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.backpill b{display:inline-block;font-weight:600;font-size:1.25em;line-height:1;transition:transform .2s}
.backpill:hover{color:#ffd29c;border-color:rgba(255,179,92,.75)}
@keyframes shipPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ---- side panels: atlas and settings (their text has its own size on top of the page's: menu text in settings) */
.atlas,.panel,.help-card{--ts:var(--tsm,1.15)}
.atlas,.panel{position:fixed;top:calc(var(--ctl-b,54px) + 8px);right:calc(16px + env(safe-area-inset-right,0px));
  width:min(calc(340px*var(--ts)),calc(100vw - 32px));display:flex;flex-direction:column;background:rgba(5,7,14,.86);border:1px solid var(--line);border-radius:4px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:5;overflow:hidden}
.atlas{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel{z-index:7;max-height:calc(100vh - var(--ctl-b,54px) - 24px);overflow:auto}
.atlas-head,.panel-head{display:flex;align-items:center;gap:8px;padding:9px 10px 8px 12px;border-bottom:1px solid var(--line)}
.ptitle{color:var(--flare);font-size:calc(10.5px*var(--ts));letter-spacing:.16em;text-transform:uppercase}
.pcount{flex:1;color:var(--faint);font-size:calc(10.5px*var(--ts))}
.panel-head .ptitle{flex:1}
.atlas-head input{display:none;flex:1;min-width:0;font-size:calc(12px*var(--ts));color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:3px;padding:6px 8px;outline:none}
.atlas-head input:focus{border-color:rgba(255,179,92,.6)}
.chip{font-size:calc(10.5px*var(--ts));color:var(--dim);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:2px 8px;cursor:pointer}
.chip:hover{color:var(--ink)}
/* the atlas is a grid: head, the controls, a results line (only when the view is not the default), the list and the collection footer.
   Every control is in plain sight: nothing scrolls sideways (rows wrap and the kinds drop to two columns before anything could overflow). */
.atlas{width:min(calc(340px*max(var(--ts),1.15)),calc(100vw - 32px));   /* (never narrower than at the default menu text: the controls must fit on their rows) */
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-areas:"head" "tools" "result" "list" "foot";
  overflow:clip}   /* (clip, not a scroll box: scrolling the list to the object in view must never scroll the whole panel) */
.atlas-head{grid-area:head}
.atlas-body{display:contents}   /* (its parts sit in the atlas grid; with .flow it becomes the one scrolling column) */
.atlas-tools{grid-area:tools;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.atl-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.atlas-tools .lbl{flex:none;color:var(--dim);font-size:calc(10px*var(--ts));letter-spacing:.1em;text-transform:uppercase;min-width:34px}
/* sort: one pill cut in four, the chosen part filled; the order button says the order the list is in ("near → far") and reverses it.
   Its words take the room of the longest ones ("small → big"), so changing the sort never moves or wraps anything. */
.sortseg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.sortseg button{min-height:28px;padding:0 7px;font-size:calc(10.5px*var(--ts));color:var(--soft);background:none;border:0;border-left:1px solid var(--line);border-radius:0;cursor:pointer;white-space:nowrap}
.sortseg button:first-child{border-left:0}
.sortseg button:hover{color:var(--ink);background:rgba(140,160,210,.08)}
.sortseg button[aria-checked="true"]{color:var(--void);background:var(--flare);font-weight:600}
.dirbtn{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 7px 0 6px;font-size:calc(10.5px*var(--ts));color:var(--soft);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:4px;cursor:pointer;white-space:nowrap}
.dirbtn span{min-width:11ch;text-align:left}
.dirbtn b{color:var(--flare);font-weight:400}
.dirbtn:hover{color:var(--ink);border-color:rgba(255,179,92,.45)}
/* show: "not seen yet", a box that works with any kind, then one radio group: all (across the top) or one kind (a grid of equal cells with their counts) */
/* (4 px of padding and a 3 px gap, 0.18.0: room for a two-digit count, "star clusters 25", at 90% menu text without widening the grid) */
.cell{display:flex;align-items:center;justify-content:space-between;gap:3px;box-sizing:border-box;min-width:0;min-height:28px;padding:0 4px;font-size:calc(10px*var(--ts));line-height:1.2;
  color:var(--soft);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:3px;cursor:pointer;white-space:nowrap;text-align:left}
.cell .n{flex:none;color:var(--dim);font-size:calc(9.5px*var(--ts));font-variant-numeric:tabular-nums}
.cell:hover{color:var(--ink);border-color:rgba(140,160,210,.45)}
.cell[aria-checked="true"]{color:var(--void);background:var(--flare);border-color:var(--flare);font-weight:600}
.cell[aria-checked="true"] .n{color:rgba(4,5,10,.75)}
.cell.done:not([aria-checked="true"]){color:var(--dim)}
.cell.done:not([aria-checked="true"]) .n{color:#a8f0b0}
.allcell{grid-column:1/-1}
.unseen{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 8px 0 6px;font-size:calc(10.5px*var(--ts));color:var(--soft);background:none;border:1px solid var(--line);border-radius:4px;cursor:pointer;white-space:nowrap}
.unseen b{font-weight:400;color:var(--soft);white-space:pre}
.unseen:hover{color:var(--ink)}
.unseen[aria-checked="true"]{color:var(--flare);border-color:rgba(255,179,92,.55);background:var(--flare-bg)}
.unseen[aria-checked="true"] b{color:var(--flare)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(99.5px*var(--ts)),1fr));gap:4px}
/* each kind's colour (0.12.0, owner: make the sections easier to tell apart): a mark on its cell, which fills with it when chosen, its heading,
   and its rows' left edge. Light enough for dark text on a chosen cell; the amber of the place in view stays the atlas's own */
[data-k="solar"]{--kc:#ffd166}[data-k="moons"]{--kc:#c8cedc}[data-k="comets"]{--kc:#b9f0ff}[data-k="stars"]{--kc:#ff9b6b}[data-k="worlds"]{--kc:#b4e35f}
[data-k="nebulae"]{--kc:#ff86c8}[data-k="clusters"]{--kc:#6fc6ff}[data-k="bh"]{--kc:#d48cff}[data-k="galaxies"]{--kc:#a59cff}[data-k="cosmic"]{--kc:#7b9dff}
[data-k="events"]{--kc:#ff6b6b}[data-k="human"]{--kc:#7fe8a8}[data-k="earth"]{--kc:#3fd6c6}
.cell[data-k]{border-left:3px solid var(--kc)}
.cell[data-k]:hover{border-color:color-mix(in srgb,var(--kc) 60%,transparent);border-left-color:var(--kc)}
.cell[data-k][aria-checked="true"]{background:var(--kc);border-color:var(--kc)}
.cats .allcell.withearth{grid-column:span 2}
/* (while a search is typed it looks through everything: the kinds fade a little, still there to tap, and a tap clears the search) */
.atlas-tools.searching .show-row,.atlas-tools.searching .cats{opacity:.6}
.sortseg button:focus-visible,.dirbtn:focus-visible,.cell:focus-visible,.unseen:focus-visible,.chip:focus-visible,.afoot:focus-visible,.brow:focus-visible,.atlas-empty button:focus-visible{outline:1px solid var(--flare);outline-offset:1px}
/* the results line: what the list shows (in words, with what its numbers measure) and the only reset. Solid, so it can stay over the rows in .flow */
.aresult{grid-area:result;display:flex;align-items:center;gap:8px;padding:3px 8px 3px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(rgba(255,179,92,.07),rgba(255,179,92,.07)),rgb(7,9,16);font-size:calc(10.5px*var(--ts));line-height:1.35}
.aresult .rtxt{flex:1 1 0;min-width:0;color:var(--flare)}
.aresult .rnote{margin-left:10px;color:var(--dim);white-space:nowrap}
.aresult .rnote:empty{display:none}
.aresult .rreset{flex:none;min-height:28px;color:var(--soft)}
.atlas-list{grid-area:list;min-height:0;overflow:auto;padding:4px 0 6px;overscroll-behavior:contain;scrollbar-width:thin}
/* (a heading stays at the top of the list while its rows scroll, so what its numbers measure is always in sight; a long title takes two lines.
   Its top is -4px: a sticky box sticks inside the list's padding, and no row may show above it) */
.agroup{position:sticky;top:-4px;z-index:1;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;padding:10px 12px 4px;color:var(--flare);background:rgb(7,9,16);font-size:calc(10.5px*var(--ts));letter-spacing:.14em;text-transform:uppercase}
.arow{scroll-margin-top:calc(34px*var(--ts))}
.agroup .gt{flex:0 1 auto;min-width:0}
.agroup[data-k]:not([data-k=""]){color:var(--kc);box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--kc) 30%,transparent)}
.agroup .gnote{flex:none;margin-left:auto;color:var(--dim);font-size:calc(10px*var(--ts));letter-spacing:.02em;text-transform:none}
.arow.child .an::before{content:"\2514\00a0";color:var(--faint);font-weight:400}
.aend{padding:10px 12px 2px;color:var(--dim);font-size:calc(10px*var(--ts))}
.aend a{display:inline-block;padding:8px 0;margin:-8px 0;color:var(--flare);text-underline-offset:3px}
/* .flow: one scrolling column under the head (phones held upright, and wherever the list would be squeezed): the controls scroll away with the list,
   the results line stays at the top and the headings stick under it (--rh, its height, kept by src/09-render.js) */
.atlas.flow{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "body" "foot"}
.atlas.flow .atlas-body{display:block;grid-area:body;min-height:0;overflow:hidden auto;overscroll-behavior:contain;scrollbar-width:thin}
.atlas.flow .atlas-tools{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
.atlas.flow .aresult{position:sticky;top:0;z-index:2}
.atlas.flow .atlas-list{overflow:visible;min-height:0}
.atlas.flow .agroup{top:var(--rh,0px)}
.atlas.flow .arow{scroll-margin-top:calc(var(--rh,0px) + 34px*var(--ts))}
.atlas.flow .afoot{border-right:0}
.atlas.flow .btray{grid-area:body;align-self:stretch}   /* (the whole column: no half-hidden control above it) */
/* the collection footer ("seen 18 of 137 [##--------] badges 1 of 9 ›"), one button that opens the badge tray over the bottom of the list */
.afoot{grid-area:foot;display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px;width:100%;box-sizing:border-box;min-height:34px;padding:5px 12px;margin:0;
  border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--dim);font-size:calc(10.5px*var(--ts));text-align:left;cursor:pointer}
.afoot b{color:var(--soft);font-weight:400}
.afoot .sf-bar{flex:1 1 0;min-width:0;overflow:hidden;white-space:pre;color:var(--faint);font-variant-ligatures:none}
.afoot .sf-badges{margin-left:auto}
.afoot i{font-style:normal;color:var(--flare);font-size:1.35em;line-height:1;transition:transform .2s}
.afoot[aria-expanded="true"] i{transform:rotate(90deg)}
.afoot:hover{color:var(--ink)}
.btray{grid-area:list;align-self:end;z-index:3;max-height:100%;box-sizing:border-box;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-bottom:4px;
  background:rgb(7,9,17);border-top:1px solid rgba(255,179,92,.35);box-shadow:0 -12px 24px rgba(0,0,0,.55);animation:trayUp .2s ease-out}   /* (solid: no row may show through the badges) */
@keyframes trayUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.bt-head{display:flex;align-items:center;gap:8px;padding:6px 8px 2px 12px}
.bt-n{flex:1;color:var(--dim);font-size:calc(10.5px*var(--ts))}
.bt-head .chip{min-height:28px}
.bt-note{margin:0;padding:0 12px 6px;color:var(--dim);font-size:calc(10px*var(--ts));line-height:1.4}
.brow{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-height:30px;padding:3px 12px;margin:0;background:none;border:0;color:var(--soft);font-size:calc(11px*var(--ts));text-align:left;cursor:pointer}
.brow:hover{background:rgba(140,160,210,.1);color:var(--ink)}
.brow .bn{flex:1;min-width:0}
.brow .bp{flex:none;color:var(--dim);font-variant-numeric:tabular-nums}
.brow i{flex:none;width:.7em;font-style:normal;color:var(--flare)}
.brow.got .bn,.brow.got .bp{color:var(--flare)}
/* a row: the name, and its number beside it, or under it (right-aligned) when both do not fit; a name is never cut */
.arow{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:5px 12px 5px 18px;color:var(--soft);cursor:pointer;font-size:calc(12px*var(--ts))}
.arow:hover,.arow.kb{background:rgba(140,160,210,.1);color:var(--ink)}
.arow[data-k]{border-left-color:color-mix(in srgb,var(--kc) 55%,transparent)}
.arow[aria-selected="true"]{background:var(--flare-bg);border-left-color:var(--flare);color:var(--flare);font-weight:600}
.arow[aria-selected="true"]::before{content:">";position:absolute;left:6px;color:var(--flare)}
.arow[aria-selected="true"] .ad{color:var(--flare);opacity:.85}
.arow .an{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.arow .ad{flex:none;margin-left:auto;color:var(--dim);font-size:calc(10.5px*var(--ts));font-weight:400;font-variant-numeric:tabular-nums;text-align:right}
.panel-foot{padding:8px 12px;border-top:1px solid var(--line);color:var(--faint);font-size:calc(10.5px*var(--ts))}
.atlas-empty{padding:14px 12px;color:var(--dim)}
.atlas-empty button{display:inline-block;min-height:28px;margin:8px 0 0;font-size:calc(10.5px*var(--ts));color:var(--flare);background:var(--flare-bg);border:1px solid rgba(255,179,92,.55);border-radius:4px;padding:0 10px;cursor:pointer}
.opt{padding:10px 12px 4px}
.opt-l{color:var(--soft);font-size:calc(11px*var(--ts));letter-spacing:.06em;margin-bottom:6px}
.opt-note{color:var(--faint);letter-spacing:0;margin-left:6px}
.seg,.tog{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.tog button{flex:1 0 auto;font-size:calc(11.5px*var(--ts));color:var(--dim);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:3px;padding:5px 8px;cursor:pointer}
.seg button:hover,.tog button:hover{color:var(--ink)}
.seg button[aria-checked="true"],.tog button[aria-pressed="true"]{color:var(--flare);border-color:rgba(255,179,92,.6);background:var(--flare-bg)}
.sound-row{align-items:center}
.sound-row button{flex:0 0 auto}
.sound-row input{flex:1;accent-color:var(--flare);min-width:80px}
.mood-note{margin-top:5px;font-size:calc(10.5px*var(--ts));color:var(--faint)}
.now-playing{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:calc(11px*var(--ts));color:var(--soft)}
.now-playing .np-l{color:var(--faint);font-size:calc(10px*var(--ts));letter-spacing:.1em;text-transform:uppercase;flex:none}
.now-playing #nowPlaying{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;-webkit-user-select:text;user-select:text}
/* the song list: every song, grouped by style; the playing one is marked */
.songs-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:30px;margin-top:8px;font-size:calc(11.5px*var(--ts));color:var(--dim);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer;text-align:left}
.songs-btn:hover{color:var(--ink)}
.songs-btn .sb-n{color:var(--faint)}
.songs-btn[aria-expanded="true"]{color:var(--ink);border-bottom-left-radius:0;border-bottom-right-radius:0}
.song-list{border:1px solid var(--line);border-top:0;border-radius:0 0 3px 3px;background:rgba(0,0,0,.25);padding:0 0 4px}
.sg-h{display:flex;justify-content:space-between;gap:8px;padding:8px 10px 3px 18px;color:var(--faint);font-size:calc(10px*var(--ts));letter-spacing:.1em;text-transform:uppercase}
.sg-h .sg-m{letter-spacing:.04em;text-transform:none}
.song{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:30px;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:4px 10px 4px 18px;color:var(--soft);cursor:pointer;font-size:calc(12px*var(--ts))}
.song:hover{background:rgba(140,160,210,.1);color:var(--ink)}
.song[aria-current="true"]{background:var(--flare-bg);border-left-color:var(--flare);color:var(--flare)}
.song[aria-current="true"]::before{content:"\266A";position:absolute;left:5px;font-size:calc(10px*var(--ts))}
.song .sn{flex:1;min-width:0;overflow-wrap:anywhere}
.song .sl{flex:none;color:var(--faint);font-size:calc(10.5px*var(--ts));font-variant-numeric:tabular-nums}
.song[aria-current="true"] .sl{color:var(--flare);opacity:.8}

/* tours and time machine panels */
.tour-list{padding:2px 0 8px}
.trow{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:7px 12px 7px 18px;cursor:pointer;color:var(--soft);position:relative}
.trow:hover{background:rgba(140,160,210,.1)}
.trow b{display:block;font-weight:500;font-size:calc(12.5px*var(--ts));color:var(--ink)}
.trow small{display:block;color:var(--faint);font-size:calc(10.5px*var(--ts))}
.trow[aria-current="true"]{background:var(--flare-bg);border-left-color:var(--flare)}
.trow[aria-current="true"] b{color:var(--flare)}
.trow[aria-current="true"]::before{content:">";position:absolute;left:6px;top:7px;color:var(--flare)}
.tm-date{display:flex;align-items:center;gap:10px}
.tm-date span{flex:1;font-size:calc(17px*var(--ts));color:var(--flare);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tm-sub{display:block;margin:4px 0 0;line-height:1.4}
#deep{width:100%;accent-color:var(--flare)}
.tm-jump button{flex:1 0 auto}

/* ---- scale ladder, right edge */
.ladder{position:fixed;right:calc(36px + env(safe-area-inset-right,0px));top:calc(var(--ctl-b,54px) + 60px);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:2px;
  background:linear-gradient(rgba(143,160,210,.55),rgba(143,160,210,.25));border-radius:1px;z-index:2;transition:right .25s}
.atlas-open .ladder{display:none}   /* (while search or the atlas is open; it used to move out into the scene) */
.lad-cap{position:absolute;right:-2px;top:-26px;color:var(--dim);font-size:calc(10px*var(--ts));letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.lad-track{position:absolute;inset:-6px -18px -6px -30px;cursor:ns-resize;touch-action:none}
.tick{position:absolute;right:-3px;transform:translateY(-50%);display:flex;align-items:center;gap:7px;background:none;border:0;padding:2px 0 2px 8px;min-height:28px;color:var(--soft);   /* (28 px to tap, less where two names sit closer: syncTickSizes) */
  font-size:calc(11px*var(--ts));letter-spacing:.03em;white-space:nowrap;cursor:pointer;text-shadow:0 0 6px #000,0 0 3px #000}
.tick::after{content:"";width:8px;height:2px;background:rgba(195,203,224,.7)}
.tick:hover,.tick.near{color:var(--flare)}
.tick:hover::after,.tick.near::after{background:var(--flare);width:12px}
.tick.here{color:var(--flare)}
.ladmark{position:absolute;right:-7px;width:16px;height:16px;transform:translateY(-50%);cursor:grab;touch-action:none;z-index:1}
.ladmark:active{cursor:grabbing}
.ladmark::before{content:"";position:absolute;inset:2px;border:2px solid var(--flare);border-radius:50%;background:var(--void);box-shadow:0 0 10px rgba(255,179,92,.5)}
.ladmark span{position:absolute;right:22px;top:50%;transform:translateY(-50%);padding:2px 7px;color:var(--void);background:var(--flare);border-radius:2px;font-size:calc(11px*var(--ts));font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.ladder.dragging .tick:not(.near){opacity:.55}
.ladder.touring > .tick,.ladder.touring .lad-track{display:none}
.ladder.touring{background:linear-gradient(rgba(168,240,176,.35),rgba(168,240,176,.2))}
.tour-track{position:absolute;inset:0}
.tt-fill{position:absolute;left:-1px;bottom:0;width:4px;border-radius:2px;background:linear-gradient(0deg,#6fd08a,#a8f0b0);box-shadow:0 0 8px rgba(168,240,176,.6);transition:height .2s linear}
.tick.tt{color:var(--soft);min-height:var(--tt-h,28px)}
.tick.tt::after{background:rgba(168,240,176,.55)}
.tick.tt.done{color:var(--faint)}
.tick.tt.done::after{background:#6fd08a}
.tick.tt.here{color:#a8f0b0;font-weight:600}
.tick.tt.here::after{background:#a8f0b0;width:14px}
.tick.tt.mute{font-size:0;gap:0;min-height:0}   /* (unnamed tour stops stay small, so they do not cover their named neighbours) */
.ladder.touring .ladmark::before{border-color:#a8f0b0;box-shadow:0 0 10px rgba(168,240,176,.6)}
.ladder.touring .ladmark span{background:#a8f0b0}
.ladder.touring .ladmark{pointer-events:none}
#btnTours.touring{color:#a8f0b0;border-color:rgba(168,240,176,.6)}
#btnTours.touring[aria-expanded="true"]{background:rgba(168,240,176,.1)}

.help{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,3,8,.72);padding:16px;z-index:10}
.help-card{max-width:880px;width:100%;background:#070a14;border:1px solid var(--line);padding:16px 20px 16px;border-radius:4px;max-height:calc(100% - 32px);overflow:auto;overscroll-behavior:contain;box-sizing:border-box;font-size:calc(12.5px*var(--ts))}
.help-top{display:flex;align-items:center;gap:10px}
.help-top h2{flex:1 1 auto}
.help h2{font-family:var(--mono);font-weight:500;font-size:calc(19px*var(--ts));margin:0}
.help p{color:var(--soft);margin:6px 0 0;max-width:72ch}
.help .lede{margin-top:4px}
/* three short columns side by side on a desk (look, go, more), one under the other on a phone */
.help-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(230px*var(--ts)),1fr));gap:4px 22px;margin:12px 0 4px}
.help h3{margin:0 0 5px;font-weight:500;font-size:calc(10.5px*var(--ts));letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 8px}
.help dt{color:var(--flare);white-space:nowrap}
.help dd{margin:0;color:var(--soft)}
.help .note{color:var(--dim);font-size:calc(11px*var(--ts))}
/* keys only with a mouse (and a keyboard, most likely), gestures only on a touch screen */
@media (pointer:coarse){ .help .kb{display:none} }
@media (pointer:fine){ .help .touch{display:none} }
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--flare);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* what's new: versions newest first, the newest open, the rest one line each until you open them */
.notes-card{max-width:640px}
.notes-list{margin:10px 0 2px}
.notes-list details{border-top:1px solid var(--line);padding:7px 0}
.notes-list details:first-child{border-top:0}
.notes-list summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;cursor:pointer;list-style:none;color:var(--soft)}
.notes-list summary::-webkit-details-marker{display:none}
.notes-list summary::before{content:"\25B8";color:var(--faint);width:1em;flex:0 0 1em}
.notes-list details[open] > summary::before{content:"\25BE"}
.notes-list .nv{color:var(--flare);font-variant-numeric:tabular-nums}
.notes-list .nt{flex:1 1 12em;order:1;min-width:0}
.notes-list details[open] .nt{color:var(--ink)}
.notes-list .nd{order:2;margin-left:auto;color:var(--faint);font-size:calc(10.5px*var(--ts));white-space:nowrap}
.notes-list ul{margin:6px 0 2px;padding-left:calc(1em + 26px);color:var(--soft)}
.notes-list li{margin:3px 0}
.notes a,.help-new a{color:var(--flare)}
#btnNotes.has-new::after,#settingsNotes.has-new::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:var(--flare);vertical-align:middle;box-shadow:0 0 6px rgba(255,179,92,.8)}
/* phones: the Halo's menu over the dock (ride along, cockpit, marker) */
.ship-menu{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(var(--dock-h,64px) + 6px);z-index:7;
  box-sizing:border-box;padding:8px;background:rgba(5,7,14,.9);border:1px solid rgba(143,230,255,.35);border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:calc(12px*var(--ts))}
.ship-menu[hidden]{display:none}
.sm-head{color:var(--ship);letter-spacing:.08em;padding:0 4px 7px}
.sm-head span{color:var(--faint);letter-spacing:.04em;margin-left:6px;font-size:calc(10.5px*var(--ts))}
.sm-row{display:flex;gap:6px}
.sm-row button{flex:1 1 0;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;cursor:pointer;
  color:var(--ink);background:rgba(143,230,255,.06);border:1px solid var(--line);border-radius:10px;font:inherit}
.sm-row button[hidden]{display:none}
.sm-row2{margin-top:6px}
.sm-row button b{font-weight:500}
.sm-row button small{color:var(--faint);font-size:calc(10px*var(--ts));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sm-row button[aria-checked="true"]{color:var(--void);background:var(--ship);border-color:var(--ship)}
.sm-row button[aria-checked="true"] small{color:rgba(4,5,10,.7)}
/* its Halo tour item is a switch like the desk's (0.9.9, owner review): the words on the left, the pill on the right; on, the pill and the border light up */
.sm-row button.sm-sw{flex-direction:row;justify-content:space-between;gap:10px;padding:6px 12px 6px 14px;text-align:left}
.sm-st{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.sm-row button.sm-sw[aria-checked="true"]{color:var(--ink);background:rgba(143,230,255,.1);border-color:rgba(143,230,255,.55)}
.sm-row button.sm-sw[aria-checked="true"] small{color:var(--ship)}
#btnShip.following{color:var(--ship);background:rgba(143,230,255,.14)}
.nogl{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--soft)}

/* collection log */
.arow.seen .an::after{content:" \2713";color:#a8f0b0;font-weight:400}
/* today's discovery */
.daily{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(56px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 32px));box-sizing:border-box;padding:10px 12px;
  background:rgba(5,7,14,.8);border:1px solid var(--line);border-left:2px solid #a8f0b0;border-radius:3px;z-index:4;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.d-top{display:flex;align-items:center;gap:8px}
.d-lbl{color:#a8f0b0;font-size:calc(10px*var(--ts));letter-spacing:.14em;text-transform:uppercase;flex:1}
.d-streak{color:var(--flare);font-size:calc(10px*var(--ts))}
.d-x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:calc(16px*var(--ts));line-height:1;padding:0 2px;
  display:grid;place-items:center;min-width:28px;min-height:28px;margin:-6px -7px -6px 0}   /* (a 28 px target; the negative margins keep the x where it was) */
.d-x:hover{color:var(--ink)}
.d-name{margin-top:4px;font-size:calc(15px*var(--ts));color:var(--ink);font-weight:500}
.d-type{color:var(--dim);font-size:calc(11px*var(--ts))}
.d-acts{display:flex;gap:6px;margin-top:8px}
/* screensaver: everything fades away */
.info,.controls,.ladder,.labels,.strip,.caption,.daily,.atlas,.panel,.shipmark,.shiparrow,.backpill{transition:opacity .25s}
body.saver .info,body.saver .brand,body.saver .topr,body.saver .info-pill,body.saver .controls,body.saver .ladder,body.saver .labels,body.saver .strip,body.saver .caption,body.saver .daily,body.saver .atlas,body.saver .panel,body.saver .shipmark,body.saver .shiparrow,body.saver .backpill{opacity:0!important;pointer-events:none!important;transition:opacity 1.2s}
body.saver #view{cursor:none}
.saver-hud{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));max-width:min(520px,calc(100vw - 56px));color:var(--soft);z-index:5;pointer-events:none;text-shadow:0 0 12px #000,0 0 4px #000;opacity:.8}
.sv-time{font-family:var(--disp);font-size:calc(34px*var(--ts));color:var(--ink);letter-spacing:.06em}
.sv-obj{margin-top:6px;font-size:calc(15px*var(--ts));color:var(--ink)}
.sv-fact{margin-top:2px;font-size:calc(12px*var(--ts));color:var(--dim);max-width:60ch}
.sv-np{margin-top:8px;font-size:calc(11px*var(--ts));color:var(--flare)}
/* (the angle line moves under the name while the screensaver plays, and back into the info panel after: moveAngleLine in 09f-features.js) */
.saver-hud .progress{margin-top:3px;opacity:1;pointer-events:none}
.saver-hud .progress .anav{display:none!important}
.btn.saver-go{width:100%;color:#a8f0b0;border-color:rgba(168,240,176,.5)}
/* photo mode: the interface hides, a small bar stays */
body.photo .info,body.photo .brand,body.photo .topr,body.photo .info-pill,body.photo .controls,body.photo .ladder,body.photo .strip,body.photo .caption,body.photo .daily,body.photo .atlas,body.photo .panel,body.photo .shipmark,body.photo .shiparrow,body.photo .backpill{opacity:0!important;pointer-events:none!important}
body.photo:not(.photo-labels) .labels{opacity:0}
.photo-bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:6px 8px;
  background:rgba(5,7,14,.82);border:1px solid var(--line);border-radius:4px;z-index:8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:calc(100vw - 24px);box-sizing:border-box}
.photo-bar .pb-l{color:var(--flare);font-size:calc(10.5px*var(--ts));letter-spacing:.14em;text-transform:uppercase;padding:0 6px}
.photo-flash{position:fixed;inset:0;background:#fff;opacity:.0;pointer-events:none;z-index:9;transition:opacity .35s}

/* tonight: events, your sky, Earth's story */
.events{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.ev{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid rgba(140,160,210,.12);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--soft);cursor:pointer;font-size:calc(11.5px*var(--ts))}
.ev:hover{color:var(--ink)}
.ev .ew{flex:none;min-width:84px;color:var(--flare);font-size:calc(10.5px*var(--ts));font-variant-numeric:tabular-nums}
.ev .et{flex:1}
.ev small{display:block;color:var(--faint);font-size:calc(10.5px*var(--ts))}
.sky-places{margin-top:6px}
.sky-where{color:var(--soft);font-size:calc(11px*var(--ts));padding:0 6px}
body.sky .info .acts,body.sky .info .qrow,body.sky .ladder,body.sky .lad-chip,body.sky .progress{opacity:.0;pointer-events:none}
.story .st-when{font-size:calc(18px*var(--ts));color:var(--flare);font-variant-numeric:tabular-nums}
#storyTime{width:100%;accent-color:var(--flare);margin-top:6px}
.st-ticks{position:relative;height:10px;margin:0 8px}
.st-ticks i{position:absolute;top:0;width:1px;height:7px;background:rgba(195,203,224,.45)}
.st-name{margin-top:8px;color:var(--ink);font-size:calc(14px*var(--ts));font-weight:500}
.st-text{margin-top:3px;color:var(--soft);font-size:calc(12px*var(--ts));min-height:3.4em;-webkit-user-select:text;user-select:text}

@media (max-width:1100px){ .search input{width:170px} }
/* ---- phones and small windows: a dock of big buttons at the bottom, the info as a card above it, the scale ladder behind a chip.
